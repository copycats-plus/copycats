modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issues}"
[[mods]]
   modId="${archives_base_name}"
   version="${version}"
   displayName="${mod_name}"
   updateJSONURL="https://raw.githubusercontent.com/copycats-plus/copycats/multiloader/update.json"
   displayURL="${mod_url}"
   logoFile="copycats_icon.png"
   credits="${mod_credits}"
   authors="${mod_authors}"
   description='''${mod_description}'''

[[dependencies.${archives_base_name}]]
   modId="neoforge"
   mandatory=true
   versionRange="${neoforge_version_range}"
   ordering="NONE"
   side="BOTH"
[[dependencies.${archives_base_name}]]
   modId="minecraft"
   mandatory=true
   versionRange="${minecraft_version_range}"
   ordering="NONE"
   side="BOTH"
[[dependencies.${archives_base_name}]]
   modId="create"
   mandatory=true
   versionRange="${create_neoforge_range}"
   ordering="NONE"
   side="BOTH"
[[dependencies.${archives_base_name}]]
   modId="aerocopycats"
   type="incompatible"
   reason="Causes copycats to crash on assembly"
   versionRange="(,1.1.1]"

[[mixins]]
config = "copycats-common.mixins.json"

[[mixins]]
config = "copycats-neoforge.mixins.json"
