plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id 'me.modmuss50.mod-publish-plugin' version "2.2.0"
}

useRenderDoc = useRenderDoc.toBoolean() & !ext.ci
def renderdocPath = (project.findProperty('renderdocDir') ?: "C:/Program Files/RenderDoc").toString()
def renderdocCmdExe = new File(renderdocPath, "renderdoccmd.exe")
if (useRenderDoc && !renderdocCmdExe.exists()) {
    throw new GradleException("RenderDoc not found at ${renderdocCmdExe} — please set -PrenderdocDir correctly")
}

loom {
    var common = project(":common")
    accessWidenerPath = common.loom.accessWidenerPath
    runs {
        client {
            vmArg "-XX:+AllowEnhancedClassRedefinition"
            programArgs "--username=Dev"
            if (useRenderDoc) {
                var renderDocDLL = new File(renderdocPath, "renderdoc.dll").toPath().toAbsolutePath()
                vmArg("-Dneoforge.rendernurse.renderdoc.library=${renderDocDLL.toString()}")
            }
        }
        server {
            vmArg "-XX:+AllowEnhancedClassRedefinition"
        }
        data {
            data()
            name "Data Generation"
            programArgs "--all", "--mod", "copycats"
            programArgs "--output", file("src/generated/resources").absolutePath
            programArgs "--existing", project(":common").file("src/main/resources").absolutePath
            programArgs "--existing-mod", "create"
        }
    }

}
architectury {
    platformSetupLoomIde()
    neoForge()
}


configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    // Create and its dependencies
    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_neoforge_version}:slim") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_neoforge_version}")
    modImplementation("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_neoforge_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_neoforge_version}")
    modImplementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")

    modLocalRuntime("curse.maven:jade-324717:${jade_neoforge_curse_id}")
    modLocalRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_neoforge_version}")

/*    modLocalRuntime("curse.maven:sodium-394468:${sodium_neoforge_curse_id}")
    modLocalRuntime("curse.maven:forgified-fabric-api-889079:6370322")// Needed for sodium*/
    modImplementation("curse.maven:additional-placements-674852:${additionalplacements_neoforge_curse_id}")
    modImplementation("curse.maven:athena-841890:${athena_neoforge_curse_id}")
    // modLocalRuntime("curse.maven:create-industry-693815:${tfmg_forge_curse_id}")
    // modLocalRuntime("curse.maven:starlight-forge-526854:4631193") // starlight is obsolete and causes crashes with Create contraptions
//    modLocalRuntime("curse.maven:create-extended-cogs-739973:${extended_cogwheels_forge_curse_id}")

    modCompileOnly("curse.maven:double-slabs-350179:${double_slabs_neoforge_curse_id}")
    modLocalRuntime("curse.maven:spark-361579:${spark_neoforge_curse_id}")
    modCompileOnly("curse.maven:selene-499980:${moonlight_curse_neoforge_id}")
    modCompileOnly("curse.maven:vertical-slabs-compat-724387:${vertical_slabs_curse_neoforge_id}")

    if (useRenderDoc) {
        localRuntime("net.neoforged.rendernurse:RenderNurse:0.0.9")
    }

//    compileOnly("io.github.llamalad7:mixinextras-common:${mixin_extras_version}")
//    annotationProcessor(implementation(include("io.github.llamalad7:mixinextras-forge:${mixin_extras_version}")))

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    atAccessWideners.add("copycats.accesswidener")
    inputFile.set(shadowJar.archiveFile)
    dependsOn shadowJar
    archiveClassifier.set(null)
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

tasks.publishMods.dependsOn(tasks.assemble)
tasks.publishMods.mustRunAfter(tasks.build)

publishMods {
    changelog = "Check out the detailed changelog at https://github.com/copycats-plus/copycats/blob/multiloader/CHANGELOG.md"
    type = STABLE
    file = tasks.remapJar.archiveFile
    displayName = file.map { it.asFile.name.substring(0, it.asFile.name.lastIndexOf('.')) }
    modLoaders.add("neoforge")

    modrinth {
        accessToken = project.findProperty("MODRINTH_TOKEN")
        projectId = "UT2M39wf"
        minecraftVersions.add(minecraft_version)
        environment = CLIENT_AND_SERVER

        requires {
            id = "LNytGWDc"
        }
        optional {
            id = "u6dRKJwZ"
        }
    }

    curseforge {
        accessToken = project.findProperty("CURSEFORGE_TOKEN")
        projectId = "968398"
        minecraftVersions.add(minecraft_version)
        client = true
        server = true
    }

    dryRun = Boolean.parseBoolean(doDryRun)
}

tasks.register('runClientWithRenderDoc', Exec) {
    group = 'application'
    description = 'Runs the Minecraft client through RenderDoc'

    // Explicitly depend on runClient
    dependsOn tasks.named('runClient')

    doFirst {
        // Get the task to gather all properties
        def baseRunClient = tasks.named('runClient').get()

        // Retrieve the executable path for Java from the runClient task
        def javaExe = baseRunClient.javaLauncher.get().executablePath.asFile.absolutePath

        // Construct the command to run RenderDoc
        def cmd = [
                renderdocCmdExe.absolutePath,
                'capture',
                '--opt-hook-children',
                '--wait-for-exit',
                '--working-dir', baseRunClient.workingDir,  // Use the same working directory as the game
                javaExe
        ]

        // Add all system properties from runClient
        baseRunClient.systemProperties.each { key, value ->
            cmd.add("-D${key}=${value}")
        }

        // Add JVM args from runClient
        cmd.addAll(baseRunClient.jvmArgs)

        // Add classpath and main class from runClient
        cmd.addAll([
                '-cp', baseRunClient.classpath.asPath,
                baseRunClient.mainClass.get()
        ])

        // Add program arguments from runClient
        cmd.addAll(baseRunClient.args)

        // Log the final command for debugging purposes
        println("Launching with command: ${cmd.join(' ')}")

        // Set the command to be executed and the working directory
        commandLine cmd
        workingDir baseRunClient.workingDir  // Set working directory same as runClient
        environment baseRunClient.environment
    }
}